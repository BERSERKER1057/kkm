<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot - Personal Data Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <!-- ===== LOGIN PAGE ===== -->
  <div id="login-page" class="w-full max-w-sm bg-white p-6 rounded-2xl shadow-lg transition-all duration-500">
    <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">AI Chatbot Login</h2>
    <div class="mb-4">
      <label class="block text-gray-700 mb-1">Email</label>
      <input id="email" type="email" placeholder="you@example.com"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 mb-1">Password</label>
      <input id="password" type="password" placeholder=""
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>
    <button id="login-btn"
      class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
      Login
    </button>
    <p id="login-error" class="text-red-500 text-center mt-2 hidden">Invalid credentials</p>
  </div>

  <!-- ===== CHATBOT PAGE ===== -->
  <div id="chat-page" class="hidden flex flex-col h-screen w-full">
    <!-- Header -->
    <header class="bg-indigo-600 text-white text-center py-4 shadow-md flex justify-between items-center px-4">
      <h1 class="text-lg font-semibold">AI Chatbot – Personal Data Assistant</h1>
      <button id="logout-btn" class="text-sm bg-white text-indigo-600 px-3 py-1 rounded-lg hover:bg-gray-100">
        Logout
      </button>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
      <div class="flex justify-start">
        <div class="bg-white text-gray-800 p-3 rounded-2xl shadow-sm max-w-xs">
          👋 Hello! I’m your Personal Data Assistant. How can I help you today?
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <div class="bg-white border-t border-gray-200 p-3 flex items-center">
      <input id="user-input" type="text" placeholder="Ask me anything..."
        class="flex-1 px-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button id="send-btn"
        class="ml-3 bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition">
        Send
      </button>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    const loginPage = document.getElementById("login-page");
    const chatPage = document.getElementById("chat-page");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginError = document.getElementById("login-error");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const chatContainer = document.getElementById("chat-container");

    // Demo credentials
    const userDB = { email: "user@example.com", password: "1234" };

    // Handle login
    loginBtn.addEventListener("click", () => {
      if (email.value === userDB.email && password.value === userDB.password) {
        // Hide login, show chatbot
        loginPage.classList.add("hidden");
        chatPage.classList.remove("hidden");
      } else {
        loginError.classList.remove("hidden");
      }
    });

    // Logout functionality
    logoutBtn.addEventListener("click", () => {
      chatPage.classList.add("hidden");
      loginPage.classList.remove("hidden");
      email.value = password.value = "";
    });

    // Chat functionality
    function addMessage(message, sender = "user") {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("flex", sender === "user" ? "justify-end" : "justify-start");
      const bubble = document.createElement("div");
      bubble.classList.add(
        "p-3", "rounded-2xl", "max-w-xs", "shadow-sm",
        sender === "user" ? "bg-indigo-600", "text-white" : "bg-white", "text-gray-800"
      );
      bubble.textContent = message;
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Send message
    sendBtn.addEventListener("click", () => {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, "user");
      userInput.value = "";
      setTimeout(() => addMessage("🔍 Retrieving your personal data for: " + text), 800);
    });

    // Press Enter to send
    userInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendBtn.click();
    });
  </script>
</body>
</html>
