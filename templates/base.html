<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7B68EE;
            --primary-dark: #6A5ACD;
            --secondary: #FF6B8B;
            --accent: #20C997;
            --dark: #2D3748;
            --light: #F8FAFC;
            --gray: #A0AEC0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --sidebar-bg: linear-gradient(180deg, #2D3748 0%, #4A5568 100%);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #EDF2F7 100%);
            color: var(--dark);
            min-height: 100vh;
            line-height: 1.6;
        }

        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--sidebar-bg);
            padding-top: 28px;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: var(--transition);
        }

        .sidebar-header {
            color: white;
            font-size: 24px;
            font-weight: 700;
            padding: 20px 24px 30px;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header i {
            color: var(--accent);
            font-size: 26px;
        }

        .sidebar a {
            padding: 16px 24px;
            text-decoration: none;
            font-size: 16px;
            color: #E2E8F0;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            border-left: 3px solid transparent;
            margin: 4px 12px;
            border-radius: 0 8px 8px 0;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-left: 3px solid var(--accent);
        }

        .sidebar a i {
            width: 20px;
            text-align: center;
        }

        .content {
            margin-left: 260px;
            padding: 40px 32px;
            min-height: 100vh;
            transition: var(--transition);
        }

        .flashes {
            margin-bottom: 24px;
        }

        .flashes ul {
            list-style: none;
            padding: 0;
        }

        .flashes li {
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
                overflow: hidden;
            }
            
            .sidebar-header span, .sidebar a span {
                display: none;
            }
            
            .content {
                margin-left: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-robot"></i>
            <span>NexusAI</span>
        </div>
        <a href="{{ url_for('upload') }}" class="{{ 'active' if request.endpoint == 'upload' else '' }}">
            <i class="fas fa-cloud-upload-alt"></i>
            <span>Upload Files</span>
        </a>
        <a href="{{ url_for('my_documents') }}" class="{{ 'active' if request.endpoint == 'files' else '' }}">
            <i class="fas fa-folder-open"></i>
            <span>My Documents</span>
        </a>
        <a href="{{ url_for('chat') }}" class="{{ 'active' if request.endpoint == 'chat' else '' }}">
            <i class="fas fa-comments"></i>
            <span>AI Assistant</span>
        </a>
        <a href="{{ url_for('logout') }}">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>
    <div class="content">
        <div class="flashes">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <ul>
                  {% for category, message in messages %}
                    <li class="flash-{{ category }}">{{ message }}</li>
                  {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}
        </div>
        {% block content %}{% endblock %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.sidebar a');
            
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
